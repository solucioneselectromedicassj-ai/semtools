<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowS">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1829"/>
      <stop offset="100%" stop-color="#152240"/>
    </linearGradient>
  </defs>

  <!-- Fondo redondeado -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Pantalla del osciloscopio -->
  <rect x="48" y="88" width="416" height="272" rx="18" fill="#060B14" stroke="#1A3A5C" stroke-width="3"/>

  <!-- Grid horizontal -->
  <g stroke="#162030" stroke-width="1.5">
    <line x1="48" y1="156" x2="464" y2="156"/>
    <line x1="48" y1="224" x2="464" y2="224"/>
    <line x1="48" y1="292" x2="464" y2="292"/>
  </g>
  <!-- Grid vertical -->
  <g stroke="#162030" stroke-width="1.5">
    <line x1="152" y1="88" x2="152" y2="360"/>
    <line x1="256" y1="88" x2="256" y2="360"/>
    <line x1="360" y1="88" x2="360" y2="360"/>
  </g>

  <!-- Señal canal 1 (cyan) -->
  <path d="M48,224 L96,224 L118,128 L140,320 L162,224 L210,224 L232,128 L254,320 L276,224 L310,224 L332,128 L354,320 L376,224 L464,224"
    fill="none" stroke="#00D9FF" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"
    filter="url(#glow)"/>

  <!-- Señal canal 2 (amber, más suave) -->
  <path d="M48,270 Q80,270 96,210 Q112,150 128,210 Q144,270 192,270 Q224,270 240,190 Q256,110 272,190 Q288,270 340,270 Q380,270 400,210 Q420,150 464,210"
    fill="none" stroke="#FFB830" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"
    opacity="0.7" filter="url(#glowS)"/>

  <!-- Línea de trigger -->
  <line x1="48" y1="224" x2="464" y2="224" stroke="#FF3355" stroke-width="1.5" stroke-dasharray="8,6" opacity="0.5"/>

  <!-- Punto de trigger -->
  <circle cx="152" cy="224" r="6" fill="#FF3355" opacity="0.8"/>

  <!-- Borde de pantalla -->
  <rect x="48" y="88" width="416" height="272" rx="18" fill="none" stroke="#1E4A7A" stroke-width="2.5"/>

  <!-- Indicadores de canal -->
  <rect x="56" y="96" width="28" height="14" rx="4" fill="#00D9FF" opacity="0.9"/>
  <text x="70" y="107" text-anchor="middle" fill="#000" font-family="monospace" font-weight="700" font-size="10">CH1</text>
  <rect x="90" y="96" width="28" height="14" rx="4" fill="#FFB830" opacity="0.8"/>
  <text x="104" y="107" text-anchor="middle" fill="#000" font-family="monospace" font-weight="700" font-size="10">CH2</text>

  <!-- Frecuencia display -->
  <text x="450" y="108" text-anchor="end" fill="#00D9FF" font-family="monospace" font-weight="700" font-size="13" opacity="0.9">1kHz</text>

  <!-- Controles del panel inferior -->
  <rect x="48" y="376" width="416" height="64" rx="12" fill="#0A0F1E" stroke="#1A2A40" stroke-width="2"/>
  <!-- Perillas -->
  <circle cx="90" cy="408" r="18" fill="#12203A" stroke="#2A4A7A" stroke-width="2"/>
  <circle cx="90" cy="408" r="8" fill="#1A3050"/>
  <line x1="90" y1="392" x2="90" y2="400" stroke="#00D9FF" stroke-width="2.5" stroke-linecap="round"/>

  <circle cx="150" cy="408" r="18" fill="#12203A" stroke="#2A4A7A" stroke-width="2"/>
  <circle cx="150" cy="408" r="8" fill="#1A3050"/>
  <line x1="150" y1="392" x2="154" y2="399" stroke="#FFB830" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Nombre -->
  <text x="290" y="403" text-anchor="middle" fill="#FFB830" font-family="monospace" font-weight="700" font-size="28" letter-spacing="5" filter="url(#glowS)">SEM</text>
  <text x="290" y="428" text-anchor="middle" fill="#5A7099" font-family="monospace" font-size="15" letter-spacing="6">TOOLS</text>
</svg>