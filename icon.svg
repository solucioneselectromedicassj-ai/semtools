<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Fondo -->
  <rect width="512" height="512" rx="96" fill="#0C0E14"/>
  <!-- Scan lines sutiles -->
  <rect width="512" height="512" rx="96" fill="url(#scan)" opacity="0.04"/>
  <defs>
    <pattern id="scan" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#fff"/>
    </pattern>
    <!-- Glow amber -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Grid de fondo (estilo osciloscopio) -->
  <g stroke="#1E2535" stroke-width="1.5" opacity="0.8">
    <line x1="128" y1="80"  x2="128" y2="432"/>
    <line x1="256" y1="80"  x2="256" y2="432"/>
    <line x1="384" y1="80"  x2="384" y2="432"/>
    <line x1="80"  y1="160" x2="432" y2="160"/>
    <line x1="80"  y1="256" x2="432" y2="256"/>
    <line x1="80"  y1="352" x2="432" y2="352"/>
  </g>
  <!-- Borde pantalla -->
  <rect x="72" y="72" width="368" height="368" rx="16" fill="none" stroke="#252A3D" stroke-width="3"/>
  <!-- Forma de onda ECG / osciloscopio — color ámbar -->
  <polyline
    points="80,256  140,256  155,256  165,180  175,340  185,256  210,256  220,200  230,256  290,256  310,256  325,220  340,300  355,256  432,256"
    fill="none" stroke="#E8A020" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"
    filter="url(#glow)"/>
  <!-- Punto de cursor -->
  <circle cx="432" cy="256" r="7" fill="#E8A020" filter="url(#glow)"/>
  <!-- Texto SEM abajo -->
  <text x="256" y="470" font-family="'Courier New',monospace" font-size="52" font-weight="700"
        text-anchor="middle" fill="#E8A020" letter-spacing="14" filter="url(#glow)">SEM</text>
</svg>
